<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/output.css">
    <title>to Do List</title>
</head>
<body onload="loadLocalStorage()" class="bg-zinc-800">
    <svg class="hidden">
        <symbol id="chevron-left" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
        </symbol>
        <symbol id="x-mark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"></path>
        </symbol>
        <symbol id="plus" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z" />
        </symbol>
        <symbol id="star" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
        </symbol>
    </svg>

    <main class="container mt-36 select-none">
        <section class="max-w-160 w-full bg-zinc-700 p-4 mx-auto rounded-2xl border-t-4 border-t-white">
            <!--* title -->
            <div class="relative pb-1.5 mb-2.5">
                <h1 class="text-xl text-white text-center">to-Do List</h1>
                <div class="absolute bottom-0 right-0 left-0 mx-auto h-px w-9/10 bg-white/20"></div>
            </div>
            <!--* Btns -->
            <div class="flex items-center justify-between px-1.5 mb-20">
                <div class="relative group">
                    <div class="show-manage flex items-center gap-0.5 text-white px-4 py-1 bg-cyan-700 rounded-sm cursor-pointer border-b-2 border-b-white/80">
                        <button>
                            همه
                        </button>
                        <svg class="size-4">
                            <use href="#chevron-left"></svg>
                        </svg>
                    </div>
                    <div class="absolute top-full right-0 translate-y-2 w-100 h-fit bg-gray-100 p-4 rounded-md opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200">
                        <ul class="managings flex items-center justify-between *:cursor-pointer *:hover:text-orange-300 *:transition-colors space-y-0.5">
                            <li class="select text-orange-300">همه</li>
                            <li>تکمیل شده ها</li>
                            <li>تکمیل نشده ها</li>
                            <li>ضروری ها</li>
                        </ul>
                    </div>
                </div>
                <div>
                    <button class="add-tasks flex items-center justify-center gap-1 text-white px-4 py-1 bg-teal-600 rounded-sm cursor-pointer border-b-2 border-b-white/80">
                        <svg class="size-4">
                            <use href="#plus"></svg>
                        </svg>
                        افزودن
                    </button>
                    <!--* form to create a new to do list -->
                    <div class="form-container hidden fixed z-50 inset-0 m-auto w-90 h-fit p-4 bg-zinc-800 rounded-2xl">
                        <!--* title & cancle -->
                        <div class="relative flex items-center justify-between text-white pb-1.5 mb-3">
                            <h2>ایجاد لیست کار ها</h2>
                            <div class="cancle-task">
                                <svg class="size-4">
                                    <use href="#x-mark"></svg>
                                </svg>
                            </div>
                            <div class="absolute bottom-0 right-0 left-0 mx-auto h-px w-9/10 bg-white/20"></div>
                        </div>
                        <div>
                            <form action="" class="form-task space-y-3">
                                <label for="toDo" class="block w-full">
                                    <input type="text" name="" id="toDo" class="input-task w-full bg-zinc-700  text-white p-1 rounded-md">
                                </label>
                                <div class="flex items-center justify-end gap-1.5">
                                    <button class="cancle-task text-white px-2.5 py-0.5 bg-rose-700/60 rounded-sm cursor-pointer">انصراف</button>
                                    <button type="submit" class="confirm-task text-white px-2.5 py-0.5 bg-teal-600 rounded-sm cursor-pointer">ذخیره</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!--* lists -->
            <div class="p-2 rounded-2xl bg-zinc-800">
                <article class="lists-set flex flex-col gap-y-1.5 max-h-80 pl-1 scroll-bar-y overflow-y-scroll">
                    <!--? it'll filled by js -->
                    
                </div>
                </article>
            </div>
        </section>
    </main>


    <div class="hidden overlay"></div>
    <script src="./assets/toDoListLocalStorageApp.js"></script>
</body>
</html>
