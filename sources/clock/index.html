<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/output.css">
    <title>clock</title>
</head>
<body class="bg-linear-to-br from-zinc-800 via-pink-800 to-neutral-800 min-h-screen flex items-center justify-center p-4">

    <div class="relative">
        <div class="bg-white/10 backdrop-blur-md rounded-3xl p-6 shadow-2xl border border-white/20">
            
            <div class="relative w-80 h-80 md:w-96 md:h-96 rounded-full bg-zinc-800 shadow-2xl border-8 border-white/40">
                
                <!-- خط 12 -->
                <div class="absolute left-1/2 top-0 w-1 h-6 bg-slate-700 -translate-x-1/2 rounded-full shadow-md"></div>
                <!-- خط 6 -->
                <div class="absolute left-1/2 bottom-0 w-1 h-6 bg-slate-700 -translate-x-1/2 rounded-full"></div>
                <!-- خط 3 -->
                <div class="absolute right-0 top-1/2 w-6 h-1 bg-slate-700 -translate-y-1/2 rounded-full"></div>
                <!-- خط 9 -->
                <div class="absolute left-0 top-1/2 w-6 h-1 bg-slate-700 -translate-y-1/2 rounded-full"></div>
                
                
                <!-- 12 -->
                <div class="absolute left-1/2 top-5 -translate-x-1/2 text-xl font-bold text-gray-50">12</div>
                <!-- 1 -->
                <div class="absolute right-[26%] top-[10%] text-lg font-bold text-gray-50">1</div>
                <!-- 2 -->
                 <div class="absolute right-[12%] top-[26%] text-lg font-bold text-gray-50">2</div>
                <!-- 3 -->
                <div class="absolute right-7 top-1/2 -translate-y-1/2 text-xl font-bold text-gray-50">3</div>
                <!-- 4 -->
                <div class="absolute right-[10%] bottom-[26%] text-lg font-bold text-gray-50">4</div>
                <!-- 5 -->
                <div class="absolute right-[26%] bottom-[10%] text-lg font-bold text-gray-50">5</div>
                <!-- 6 -->
                <div class="absolute left-1/2 bottom-5 -translate-x-1/2 text-xl font-bold text-gray-50">6</div>
                <!-- 7 -->
                <div class="absolute left-[26%] bottom-[10%] text-lg font-bold text-gray-50">7</div>
                <!-- 8 -->
                <div class="absolute left-[12%] bottom-[26%] text-lg font-bold text-gray-50">8</div>
                <!-- 9 -->
                <div class="absolute left-7 top-1/2 -translate-y-1/2 text-xl font-bold text-gray-50">9</div>
                <!-- 10 -->
                <div class="absolute left-[12%] top-[26%] text-lg font-bold text-gray-50">10</div>
                <!-- 11 -->
                <div class="absolute left-[26%] top-[10%] text-lg font-bold text-gray-50">11</div>
                
                <!-- ===== عقربه ساعت ===== -->
                <div id="hourHand" class="hand absolute left-1/2 top-1/2 w-1.5 h-20 bg-gray-200 rounded-full -translate-x-1/2 -translate-y-full shadow-lg" 
                     style="transform-origin: 50% 100%; transform: rotate(0deg) translateY(-20%);"></div>
                
                <!-- ===== عقربه دقیقه ===== -->
                <div id="minuteHand" class="hand absolute left-1/2 top-1/2 w-1 h-25 bg-gray-50 rounded-full -translate-x-1/2 -translate-y-full shadow-md" 
                     style="transform-origin: 50% 100%; transform: rotate(0deg) translateY(-20%);"></div>
                
                <!-- ===== عقربه ثانیه (باریک و قرمز) ===== -->
                <div id="secondHand" class="hand absolute left-1/2 top-1/2 w-0.5 h-30 bg-pink-500 rounded-full -translate-x-1/2 -translate-y-full shadow-sm" 
                     style="transform-origin: 50% 100%; transform: rotate(0deg) translateY(-20%);"></div>
                
                <!-- نقطه مرکزی ساعت -->
                <div class="absolute left-1/2 top-1/2 w-4 h-4 bg-slate-800 rounded-full -translate-x-1/2 -translate-y-1/2 shadow-lg border-2 border-amber-200"></div>
                <div class="absolute left-1/2 top-1/2 w-1.5 h-1.5 bg-red-500 rounded-full -translate-x-1/2 -translate-y-1/2"></div>
                
            </div>
        </div>
        
        <!-- متن دیجیتال زیر ساعت با Tailwind -->
        <div class="mt-6 text-center">
            <div id="digitalTime" class="text-3xl font-mono font-bold text-white bg-black/30 backdrop-blur-sm px-6 py-2 rounded-2xl inline-block shadow-lg border border-white/20">
                00:00:00
            </div>
            <p class="text-white/60 text-sm mt-3 font-medium">ساعت عقربه‌ای با Tailwind CSS</p>
        </div>
    </div>

    <script src="./assets/app.js"></script>
</body>
</html>
