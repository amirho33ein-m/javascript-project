<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/output.css">
    <title>cart</title>
</head>
<body class="bg-gray-200">
    <svg class="hidden">
        <symbol id="shopping-cart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.25 2.25a.75.75 0 0 0 0 1.5h1.386c.17 0 .318.114.362.278l2.558 9.592a3.752 3.752 0 0 0-2.806 3.63c0 .414.336.75.75.75h15.75a.75.75 0 0 0 0-1.5H5.378A2.25 2.25 0 0 1 7.5 15h11.218a.75.75 0 0 0 .674-.421 60.358 60.358 0 0 0 2.96-7.228.75.75 0 0 0-.525-.965A60.864 60.864 0 0 0 5.68 4.509l-.232-.867A1.875 1.875 0 0 0 3.636 2.25H2.25ZM3.75 20.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM16.5 20.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Z"></path>
        </symbol>
        <symbol id="search" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"></path>
        </symbol>
        <symbol id="plus" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z"></path>
        </symbol>
        <symbol id="minus" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4 10a.75.75 0 0 1 .75-.75h10.5a.75.75 0 0 1 0 1.5H4.75A.75.75 0 0 1 4 10Z" clip-rule="evenodd"></path>
        </symbol>
        <symbol id="bar-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M12 17.25h8.25"></path>
        </symbol>
        <symbol id="x-mark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"></path>
        </symbol>
        <symbol id="star" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"></path>
        </symbol>
        <symbol id="bolt" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z"></path>
        </symbol>
        <symbol id="heart" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"></path>
        </symbol>
        <symbol id="arrows-up-down" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5 7.5 3m0 0L12 7.5M7.5 3v13.5m13.5 0L16.5 21m0 0L12 16.5m4.5 4.5V7.5"></path>
        </symbol>
        <symbol id="chevron-left" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"></path>
        </symbol>
        <symbol id="chevron-right" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"></path>
        </symbol>
        <symbol id="arrow-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" d="M14 8a.75.75 0 0 1-.75.75H4.56l3.22 3.22a.75.75 0 1 1-1.06 1.06l-4.5-4.5a.75.75 0 0 1 0-1.06l4.5-4.5a.75.75 0 0 1 1.06 1.06L4.56 7.25h8.69A.75.75 0 0 1 14 8Z" clip-rule="evenodd"></path>
        </symbol>
        <symbol id="check-badge" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z"></path>
        </symbol>
        <symbol id="trash" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
        </symbol>
        <symbol id="info" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
        </symbol>

    </svg>

    <header class="fixed top-0 left-0 right-0 z-40 mx-auto flex items-center justify-between mt-8 w-[95%] h-fit bg-gray-50 p-6 rounded-2xl">
        <nav>
            <ul class="flex items-center justify-between gap-2.5 lg:gap-3 xl:gap-5 *:text-neutral-950">
                <li><a href="#">صفحه اصلی</a></li>
                <li><a href="#">محصولات</a></li>
                <li><a href="#">تخفیف ها</a></li>
                <li><a href="#">درباره ما</a></li>
                <li><a href="#">تماس با ما</a></li>
                <li class="hidden lg:flex items-center justify-center gap-2 w-75 lg:w-75 xl:w-92 h-9.5 mr-1.5 bg-white px-2 rounded-lg ring ring-emerald-950">
                    <input type="text" class="w-full text-neutral-700 outline-0" placeholder="جست و جو">
                    <button type="submit">
                        <svg class="w-6 h-6 text-neutral-950">
                            <use href="#search"></use>
                        </svg>
                    </button>
                </li>
                <li class="relative search-btn mr-2 cursor-pointer block lg:hidden">
                    <p class="text-white">جست و جو</p>
                    <div class=" search-btn-active hidden absolute top-10 left-0 bg-white dark:bg-zinc-700 text-neutral-700 dark:text-white w-95 h-9.5 px-2 rounded-lg shadow-light-thin dark:shadow-dark-thin">
                        <input type="text" class="w-full h-full outline-0" placeholder="جست و جو">
                        <button type="submit">
                            <svg class="w-6 h-6 text-neutral-950 dark:text-white">
                                <use href="#search"></use>
                            </svg>
                        </button>
                    </div>
                </li>
            </ul>
        </nav>
        <nav>
            <div class="relative group">
                <svg class="w-6 h-6 text-neutral-950 group-hover:text-zinc-700 transition-all delay-75">
                    <use href="#shopping-cart"></use>
                </svg>
                <!-- cart details -->
                <div class="absolute top-10 left-0 z-45 invisible opacity-0 group-hover:opacity-100 group-hover:visible w-96 bg-white dark:bg-neutral-700 py-4 px-2 shadow-2xl border-t-4 border-yellow-500 rounded-xl transition-all delay-75">
                    <!-- link to cart shpping -->
                    <div class="flex items-center justify-end pb-2.5 border-b border-zinc-800/10 dark:border-white/10">
                        <a href="#" class="inline-flex items-center justify-end gap-1 text-orange-300">
                            <svg class="w-3.5 h-3.5">
                                <use href="#arrow-top-right"></use>
                            </svg>
                            <span class="font-Shabnam-Thin text-sm">مشاهده سبد خرید</span>
                        </a>
                    </div>
                    <!-- details of cart -->
                    <div class="container-cart overflow-auto scrollbar-costomize-1 h-60 divide-y divide-zinc-700/5 dark:divide-white/5">
                        <!-- ? it'll be filled by js; -->
                    </div>
                    <!-- pay / finall price -->
                    <div class="flex items-center justify-between mt-5">
                        <div class="">
                            <p class="flex flex-col">
                                <span class="text-xs text-zinc-300 mb-1">مبلغ قابل پرداخت</span>
                                <span class="text-zinc-700 text-xl dark:text-white">
                                    <span class="final-cost">0</span>
                                    <span>تومان</span>
                                </span>
                            </p>
                        </div>
                        <div class="rounded-xl overflow-hidden bg-teal-600 dark:bg-emerald-500 border-2 border-white/0 hover:border-neutral-700 dark:hover:border-white hover:shadow-dark dark:hover:shadow-light transition cursor-pointer">
                            <p class="text-white  px-7.5 py-3.5">ثبت سفارش</p>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container max-w-300 mt-48">
        <section class="mb-12 md:mb-16">
            <!-- title of newest product -->
            <div class="flex flex-col md:flex-row items-center md:items-start justify-between gap-y-6 mb-8 md:mb-12">
                <div class="flex gap-2">
                    <svg class="w-6 h-6 text-orange-300 hidden md:inline">
                        <use href="#bolt"></use>
                    </svg>
                    <div class="flex flex-col items-center md:items-start">
                        <h3 class="font-Shabnam-Bold text-2xl text-zinc-700">جدیدترین محصولات روز</h3>
                        <p class="text-zinc-700">جدیدترین و بروزترین محصولات</p>
                    </div>
                </div>
                <div>   
                    <a href="#" class="flex items-center gap-1.5 text-orange-300 text-smbg-zinc-700 md:text-base px-2 md:px-3 py-1 shadow-dark-thin rounded-sm">
                        مشاهده همه
                        <svg class="w-4 h-4 text-orange-300 rounded-sm">
                            <use href="#arrow-left"></use>
                        </svg>
                    </a>
                </div>
            </div>
            <!-- container of newest product -->
            <div class="container-product grid gap-2 md:gap-4 grid-cols-2 md:grid-cols-3 lg:grid-cols-4 *:py-2 md:*:py-4 *:px-2 md:*:px-4 *:bg-zinc-700">
                <!-- ? it'll be filled by js; -->
            </div>
            <!-- paginator -->
            <div class="flex items-center justify-center mt-6">
                <div class="flex items-center gap-2 *:bg-zinc-700 *:text-sm md:*:text-base *:w-8 *:h-8 *:p-1 text-orange-300 *:rounded-sm">
                    <svg>
                        <use href="#chevron-right"></use>
                    </svg>
                    <span class="text-center leading-7">١</span>
                    <span class="text-center leading-7">٢</span>
                    <span class="text-center leading-7">...</span>
                    <span class="text-center leading-7">۴</span>
                    <svg>
                        <use href="#chevron-left"></use>
                    </svg>
                </div>
            </div>
        </section>

        <!-- * error message by cart -->
        <section class="error-message fixed top-0 left-0 z-40 translate-y-32 translate-x-8 flex items-center justify-center w-0 h-12 overflow-hidden bg-gray-50 transition-all delay-150 rounded-2xl">
            <div class="flex items-center gap-1.5 mx-4">
                <svg class="w-6 h-6 text-sky-500">
                    <use href="#info"></use>
                </svg>
                <p class=" text-xs text-nowrap">این محصول قبلا به سبد خرید افزوده شده</p>
            </div>
        </section>
    </main>

    <script src="./assets/cartApp.js"></script>
</body>
</html>
