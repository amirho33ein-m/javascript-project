<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/output.css">
    <title>Audio - 1</title>
</head>
<body class="bg-zinc-800">
    <svg class="hidden">
        <symbol id="play" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" />
        </symbol>
        <symbol id="pause" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5" />
        </symbol>
        <symbol id="forword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061A1.125 1.125 0 0 1 3 16.811V8.69ZM12.75 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061a1.125 1.125 0 0 1-1.683-.977V8.69Z" />
        </symbol>
        <symbol id="backword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 16.811c0 .864-.933 1.406-1.683.977l-7.108-4.061a1.125 1.125 0 0 1 0-1.954l7.108-4.061A1.125 1.125 0 0 1 21 8.689v8.122ZM11.25 16.811c0 .864-.933 1.406-1.683.977l-7.108-4.061a1.125 1.125 0 0 1 0-1.954l7.108-4.061a1.125 1.125 0 0 1 1.683.977v8.122Z" />
        </symbol>
        <symbol id="settings" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 0 1 1.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.559.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.894.149c-.424.07-.764.383-.929.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 0 1-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.398.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 0 1-.12-1.45l.527-.737c.25-.35.272-.806.108-1.204-.165-.397-.506-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.108-1.204l-.526-.738a1.125 1.125 0 0 1 .12-1.45l.773-.773a1.125 1.125 0 0 1 1.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </symbol>
        <symbol id="play-list" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 0 1 0 3.75H5.625a1.875 1.875 0 0 1 0-3.75Z" />
        </symbol>
        <symbol id="x-mark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"></path>
        </symbol>
        <symbol id="arrow-path" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 0 0-3.7-3.7 48.678 48.678 0 0 0-7.324 0 4.006 4.006 0 0 0-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 0 0 3.7 3.7 48.656 48.656 0 0 0 7.324 0 4.006 4.006 0 0 0 3.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3-3 3" />
        </symbol>
        <symbol id="arrow-uturn-right" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m15 15 6-6m0 0-6-6m6 6H9a6 6 0 0 0 0 12h3" />
        </symbol>
        <symbol id="arrow-uturn-left" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
        </symbol>
    </svg>

    <main class="flex justify-center items-center w-full h-screen">
        <!-- 1 -->
        <section>
            <audio src="./assets/audio/Metamorphosis.mp3"></audio>
        </section>
        <!-- 2 -->
        <section class="max-w-70 w-full bg-neutral-800 p-4 border-r-4 border-r-white/80 rounded-2xl">
            <article class="flex flex-col items-center gap-y-3">
                <div class="group relative size-60 rounded-2xl overflow-hidden border-b-4 border-b-white/80">
                    <img src="./assets/imgs/Wo.png" loading="lazy" alt="Wo" class="image w-full h-full text-white object-cover object-top">
                    <div class="absolute top-0 right-0 left-0 z-50 p-1.5 flex items-center gap-3 w-10 overflow-hidden transition-all duration-500">
                        <button class="settings-menu">
                            <svg class="size-7 text-white/40 hover:text-cyan-500/80 hover:scale-110 transition-all delay-150">
                                <use href="#settings"></use>
                            </svg>
                            <svg class="hidden size-7 text-white/40 hover:text-red-500/80 hover:scale-110 transition-all delay-150">
                                <use href="#x-mark"></use>
                            </svg>
                        </button>
                        <div class="flex items-center gap-x-1.5">
                            <button>
                                <svg class="size-5 text-white/40 hover:text-cyan-500/80 hover:scale-110 transition-all delay-150">
                                    <use href="#play-list"></use>
                                </svg>
                            </button>
                            <!--* playBackRate -->
                            <button class="relative ">
                                <span class="play-back-rate flex items-center justify-center w-11.5 py-0.5 px-1 border border-white/40 hover:bg-cyan-500/80 hover:border-cyan-500/80 rounded-full text-white/40 hover:text-white/80 transition-all delay-150 text-sm">
                                    <span class="font-shabnam-Light text-xs">×</span>
                                    <span class="font-shabnam-Light text-xs">1</span>
                                </span>
                                <div class="reset-play-back-rate invisible absolute top-0 bottom-0 left-0 -translate-x-6 flex items-center justify-center my-auto *:text-white/40 *:hover:text-white/80">
                                    <svg class="size-5 hover:scale-110 transition-all delay-150">
                                        <use href="#arrow-path"></use>
                                    </svg>
                                </div>
                            </button>
                        </div>
                    </div>
                    <div class="shadow-x invisible opacity-0 absolute inset-0 z-40 m-auto flex items-center justify-center bg-radial from-neutral-800/10 to-neutral-800/69 to-69% group-hover:visible group-hover:opacity-100 transition-all duration-150 delay-150">
                        <button class="play-center cursor-pointer bg-radial from-neutral-800/0 from-20% to-neutral-800/80 rounded-full">
                            <svg class="play size-26 text-cyan-400/80 transition-all">
                                <use href="#play"></use>
                            </svg>
                            <svg class="hidden pause size-26 text-cyan-400/80 transition-all">
                                <use href="#pause"></use>
                            </svg>
                        </button>
                    </div>
                    <!--* ten-sec-forword-show -->
                    <div class="ten-sec-forword-show invisible opacity-0 scale-90 absolute inset-0 z-40 m-auto flex items-end justify-start p-1.5 transition-all">
                        <div class="relative bg-radial from-neutral-800/0 from-20% to-neutral-800/80 rounded-full">
                            <svg class="size-13 text-cyan-400/80">
                                <use href="#arrow-uturn-right"></use>
                            </svg>
                            <span class="absolute inset-0 mt-2 mr-2 flex items-center justify-center text-sm text-cyan-500">10</span>
                        </div>
                    </div>
                    <!--* ten-sec-backword-show -->
                    <div class="ten-sec-backword-show invisible opacity-0 scale-90 absolute inset-0 z-40 m-auto flex items-end justify-end p-1.5 transition-all">
                        <div class="relative bg-radial from-neutral-800/0 from-20% to-neutral-800/80 rounded-full">
                            <svg class="size-13 text-cyan-400/80">
                                <use href="#arrow-uturn-left"></use>
                            </svg>
                            <span class="absolute inset-0 mt-2 ml-2 flex items-center justify-center text-sm text-cyan-500">10</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center justify-center gap-2.5">
                    <button class="ten-sec-forword flex items-center justify-center size-8 text-white/80 bg-radial from-zinc-700/20 from-40% to-zinc-700/80 hover:from-cyan-500/20 hover:to-cyan-500/80 transition-colors duration-100 delay-100 rounded-full cursor-pointer">+10</button>
                    <button class="next-audio flex items-center justify-center size-10  bg-radial from-zinc-700/20 from-40% to-zinc-700/80 hover:from-cyan-500/20 hover:to-cyan-500/80 transition-colors duration-100 delay-100 cursor-pointer rounded-full">
                        <svg class="size-6 text-white transition-all delay-100">
                            <use href="#forword"></use>
                        </svg>
                    </button>
                    <button class="play-pause flex items-center justify-center size-12 bg-radial from-zinc-700/20 from-30% to-zinc-700/80 hover:from-cyan-500/20 hover:to-cyan-500/80 transition-colors duration-100 delay-100 rounded-full cursor-pointer">
                        <svg class="play size-6 text-white transition-all delay-100">
                            <use href="#play"></use>
                        </svg>
                        <svg class="hidden pause size-6 text-white transition-all delay-100">
                            <use href="#pause"></use>
                        </svg>
                    </button>
                    <button class="previous-audio flex items-center justify-center size-10 bg-radial from-zinc-700/20 from-40% to-zinc-700/80 hover:from-cyan-500/20 hover:to-cyan-500/80 transition-colors duration-100 delay-100 rounded-full cursor-pointer">
                        <svg class="size-6 text-white transition-all delay-100">
                            <use href="#backword"></use>
                        </svg>
                    </button>
                    <button class="ten-sec-backword flex items-center justify-center size-8 text-white/80 bg-radial from-zinc-700/20 from-40% to-zinc-700/80 hover:from-cyan-500/20 hover:to-cyan-500/80 transition-colors duration-100 delay-100 rounded-full cursor-pointer">10-</button>
                </div>
                <div class="w-full">
                    
                    <div class="w-full">
                        <input type="range" value="0"  min="0" max="1" step="0.001" name="" id="" class="range lrt range-input">
                    </div>

                    <div class="flex items-center justify-between gap-2.5 *:mx-1.5">
                        <!--* duration -->
                        <div>
                            <span class="duration text-white/80 text-xs font-shabnam-Light">04:10</span>
                        </div>
                        <!--* cuurentTime -->
                        <div>
                            <span class="current-time text-white/80 text-xs font-shabnam-Light">01:01</span>
                        </div>
                    </div>
                </div>
            </article>
        </section>        
    </main>

    <script src="./assets/app.js"></script>
</body>
</html>
