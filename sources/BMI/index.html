<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/output.css">
    <title>BMI</title>
</head>
<body class="bg-zinc-800">
    <svg class="hidden">
        <symbol id="x-mark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"></path>
        </symbol>
    </svg>

    <main class="container h-screen flex items-center justify-md">
        <!--* Inputs; -->
        <section class="input-container max-w-80 w-full bg-neutral-800 p-4 border-t-4 border-t-gray-200 rounded-2xl">
            <div class="mb-3.5 pb-1.5 border-b border-b-white/20">
                <h1 class="text-white text-lg font-shabnam-Bold">شاخص توده بدنی | (BMI)</h1>
            </div>
            <div>
                <form action="" class="flex flex-col gap-2.5">
                    <label for="inp_1">
                        <input placeholder="قد «سانتی متر»" id="inp_1" type="text" name="" class="height-input w-full text-center text-white placeholder:text-start placeholder:text-white/60 bg-zinc-700 p-2.5 indent-2.5 caret-orange-300 rounded-md">
                    </label>
                    <label for="inp_2">
                        <input placeholder="وزن «کیلو گرم»" id="inp_2" type="text" name="" class="weight-input w-full text-center text-white placeholder:text-start placeholder:text-white/60 bg-zinc-700 p-2.5 indent-2.5 caret-orange-300 rounded-md">
                    </label>
                    <button  type="submit" class="submit-btn w-full bg-pink-500/80 text-white hover:bg-pink-500 transition-colors delay-100 p-1.5 mt-3 cursor-pointer rounded-2xl">محاسبه کن</button>
                </form>
            </div>
        </section>
        <!--* result modal; -->
        <section class="hidden modal-container max-w-80 w-full bg-neutral-800 p-4 rounded-2xl">
            <div>
                <div class="flex items-center justify-between mb-6 pb-1.5 border-b border-b-white/20">
                    <h2 class="text-white/80 font-shabnam-Light">نتیجه تست | (BMI)</h2>
                    <button class="close-modal bg-neutral-700 p-1 rounded-full cursor-pointer">
                        <svg class="size-5 text-rose-500">
                            <use href="#x-mark"></use>
                        </svg>
                    </button>
                </div>
                <!--* results -->
                <div>
                    <div class="flex flex-col items-center justify-center gap-y-1.5">
                        <span class="text-white">(BMI)</span>
                        <!--* low/normal/redundent/fat-1/fat-2/fat-3 -->
                        <div>
                            <span class="text-white">شاخص توده بدنی</span>
                            <div class="get_result peer mt-1.5" data-result=""></div>
                            <div class="
                                flex flex-col items-center justify-center gap-y-1.5
                                peer-data-[result=low]:text-lime-300
                                peer-data-[result=normal]:text-green-500
                                peer-data-[result=redundent]:text-yellow-300
                                peer-data-[result=fat-1]:text-orange-400
                                peer-data-[result=fat-2]:text-rose-500
                                peer-data-[result=fat-3]:text-rose-700
                            ">
                                <span class="value-result text-8xl">10</span>
                                <span class="definition-result text-lg">10</span>
                            </div>
                        </div>
                    </div>
                    <div></div>
                    <!--* close -->
                    <div class="flex justify-end">
                        <button type="submit" class="return w-1/3 bg-pink-500/80 text-white hover:bg-pink-500 transition-colors delay-100 p-1.5 mt-3 cursor-pointer rounded-2xl">بازگشت</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="./assets/app.js"></script>
</body>
</html>
